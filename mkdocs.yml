site_name: AE Raumklima Bootcamp
site_description: Geführter Lernleitfaden für das IT-Bootcamp – Web-App Entwicklung für einen Raumklima-Monitor
site_author: Gianluca Barbieri
repo_url: https://github.com/HeiligerG/ae-raumklima-bootcamp
edit_uri: edit/master/docs/

theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Light Mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - toc.integrate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HeiligerG/ae-raumklima-bootcamp

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3

# Mermaid.js manuell laden (mkdocs-material 9.7 hat keine
# native Mermaid-Unterstützung mehr, der Code-Block wird
# nur als <pre class="mermaid"> gerendert, nicht als SVG)
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

# Mermaid.min.css NICHT als extra_css laden, weil:
# - 404 Fehler auf unpkg (existiert nicht als separate Datei)
# - Mermaid injected die noetigen Styles inline in jedes SVG
# - Theme-eigene CSS reicht fuer die Standard-Darstellung

plugins:
  - search:
      lang: de

